name: Docker-application-deployment
on:
  push:
    branches: [ "main" ]

  workflow_dispatch:
jobs:

  build:
    runs-on: ubuntu-latest
    steps:
      - name: deploy on ec2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_IP}}
          username: ${{secrets.EC2_UN}}
          key: ${{secrets.EC2_CR}}
          scripts: |
            touch index.html
            cp /var/log/dnf.log /home/ec2-user/work.log



