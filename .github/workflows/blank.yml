name: Docker-application-deployment
on:
  push:
    branches: [ "main" ]

  workflow_dispatch:
jobs:

  build:
    runs-on: ubuntu-latest
    steps:
      - name: deploy on ec2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_IP}}
          username: ${{secrets.EC2_UN}}
          key: ${{secrets.EC2_CR}}
          script: |
            echo "verify the git and docker"
            if ! command -v git &> /dev/null
            then
                echo "git could not be found, installing git"
                sudo yum update
                sudo yum install git -y
            else
                echo "git is already installed"
            fi
            if ! command -v docker &> /dev/null
            then
                echo "docker could not be found, installing docker"
                sudo yum update
                sudo yum install docker -y
            else
                echo "docker is already installed"
            fi
            cd /home/ubuntu
            git clone https://github.com/Giriprakam1429/Docker-Deployement-repo.git app || true
            cd app
            docker build -t myapp .
            docker run --name myapp-container -d -p 80:80 myapp
